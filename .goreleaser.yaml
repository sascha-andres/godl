version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: amd64

archives:
  - name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz

checksum:
  name_template: 'checksums.txt'

brews:
  - name: godl
    repository:
      owner: sascha-andres
      name: homebrew-tap
      branch: main
      git:
        url: 'ssh://git@github.com/sascha-andres/homebrew-tap.git'
        private_key: '{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}'
    directory: Formula
    homepage: "https://github.com/sascha-andres/godl"
    description: "Similar to ansible-role-golang but implemented as a single binary"
    install: |
      bin.install "godl"
    test: |
      system "#{bin}/godl", "-tool-version"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
